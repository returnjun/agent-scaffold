server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import: optional:classpath:application-prod.local.yml
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AgentScaffold_HikariCP
      minimum-idle: 15 # 最小空闲连接数量
      idle-timeout: 180000 # 空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 # 连接池最大连接数，默认是10
      auto-commit: true # 控制从池返回的连接默认自动提交行为
      max-lifetime: 1800000 # 连接池中的连接最大生命周期，默认1800000（30分钟）
      connection-timeout: 30000 # 数据库连接超时时间，默认30秒
      connection-test-query: SELECT 1

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 必须与初始化 SQL 的 @agent_config_master_key 保持一致。
ai:
  agent:
    database:
      master-key: ${AGENT_CONFIG_MASTER_KEY}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

