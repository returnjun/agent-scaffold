<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能体工作台登录入口">
    <title>Agent Console · 登录</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
<main class="login-shell">
    <section class="brand-panel" aria-labelledby="brand-title">
        <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="img">
                <path d="M20 4 34 12v16L20 36 6 28V12L20 4Z"/><circle cx="20" cy="20" r="4"/>
                <path d="m20 8 0 8M20 24v8M9.5 14l7 4M23.5 22l7 4M30.5 14l-7 4M16.5 22l-7 4"/>
            </svg>
        </div>
        <div class="brand-copy">
            <p class="eyebrow"><span></span> AGENT INFRASTRUCTURE</p>
            <h1 id="brand-title">让每一个智能体<br>清晰、有序地工作。</h1>
            <p class="brand-description">统一编排模型、工具与工作流，让复杂任务在一个可靠的系统中持续运转。</p>
        </div>
        <div class="system-note"><span class="status-dot" aria-hidden="true"></span><div><strong>服务运行正常</strong><span>Agent runtime is ready</span></div></div>
        <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="grid" aria-hidden="true"></div>
    </section>
    <section class="form-panel">
        <div class="form-wrap">
            <div class="mobile-brand"><span class="mobile-logo">A</span><span>Agent Console</span></div>
            <header class="form-header"><p class="form-kicker">WELCOME BACK</p><h2>登录智能体工作台</h2><p>使用你的工作台账号继续</p></header>
            <form id="login-form" novalidate>
                <div class="field-group">
                    <label for="username">账号</label>
                    <div class="input-shell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><input id="username" name="username" type="text" value="admin" autocomplete="username" spellcheck="false" aria-describedby="login-message"></div>
                </div>
                <div class="field-group">
                    <div class="label-row"><label for="password">密码</label><span>默认密码 admin</span></div>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12a2 2 0 0 1 2 2v8H4v-8a2 2 0 0 1 2-2Z"/></svg>
                        <input id="password" name="password" type="password" value="admin" autocomplete="current-password" aria-describedby="login-message">
                        <button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.1 2.7M6.1 6.2C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1 0 2-.2 2.8-.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
                    </div>
                </div>
                <p class="message" id="login-message" role="status" aria-live="polite"></p>
                <button class="submit-button" type="submit"><span>进入工作台</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
            </form>
            <footer>Agent Console <span>·</span> Secure Access</footer>
        </div>
    </section>
</main>
<script src="./js/login.js"></script>
</body>
</html>
